[package]
name = "copilot-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
github-copilot-sdk = { git = "https://github.com/github/copilot-sdk.git", tag = "v1.0.23-preview.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync", "rt", "time", "macros"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "test-util"] }

[lints]
workspace = true
