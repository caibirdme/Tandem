[package]
name = "copilot-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.23"
fsys = { version = "1", default-features = false }
github-copilot-sdk = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "time", "macros"] }
url = "2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winioctl"] }
winwrap = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "test-util"] }

[lints]
workspace = true
