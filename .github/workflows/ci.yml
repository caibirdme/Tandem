name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      rust: ${{ steps.filter.outputs.rust }}
      bundle: ${{ steps.filter.outputs.bundle }}
    steps:
      # Run web and Rust unless all changes are excluded; bundle only when its inputs change.
      # User guides and README screenshots live under docs/**, so documentation-only edits run Format.
      # Attachment UI modules use the web rules; tests/attachment_acceptance.py runs inside
      # the existing local and remote Rust integration steps below.
      # tests/daemon_acceptance.py and tests/remote_protocol.py are included by the
      # remote integration step; macOS also exercises the real Unix daemon/proxies.
      # tests/fleet_acceptance.py is included by local and remote integration checks.
      # tests/agentlens_e2e.py verifies Chat/Work-only export with the real SDK below.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            web:
              - '**'
              - '!crates/**'
              - '!src-tauri/**'
              - '!tests/**'
              - '!docs/**'
              - '!**/*.md'
              - '!Cargo.toml'
              - '!Cargo.lock'
              - '!rust-toolchain.toml'
              - '!rustfmt.toml'
              - '!scripts/*.py'
              - '!justfile'
              - '!.oxfmtrc.json'
              - '!.github/workflows/bundle.yml'
              - '!.github/workflows/release.yml'
            rust:
              - '**'
              - '!src/**'
              - '!public/**'
              - '!index.html'
              - '!docs/**'
              - '!**/*.md'
              - '!package.json'
              - '!pnpm-lock.yaml'
              - '!pnpm-workspace.yaml'
              - '!tsconfig.json'
              - '!vite.config.ts'
              - '!.oxfmtrc.json'
              - '!.oxlintrc.json'
              - '!scripts/*.mjs'
              - '!justfile'
              - '!.github/workflows/bundle.yml'
              - '!.github/workflows/release.yml'
            bundle:
              - '.github/workflows/bundle.yml'
              - 'src-tauri/tauri*.conf.json'
              - 'src-tauri/icons/**'
              - 'src-tauri/remote/**'
              - 'src-tauri/build.rs'
              - 'src-tauri/Cargo.toml'
              - 'crates/tandem-server/build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  format:
    name: Format
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - if: needs.changes.outputs.rust == 'true'
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - if: needs.changes.outputs.rust == 'true'
        run: cargo +nightly fmt --all -- --check

  web:
    name: Web (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - if: matrix.os == 'macos-15'
        run: pnpm lint
      - if: matrix.os == 'macos-15'
        run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: rustup toolchain install
      # Reuse PR-scoped caches on later commits without requiring a main-branch CI run.
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/check_workspace.py
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p tandem-dev-server -p tandem-server --locked
      - run: python tests/provider_models_e2e.py
      - run: python tests/runtime_e2e.py
      - run: python tests/agentlens_e2e.py
      # POSIX runs shared-daemon acceptance even when an SSH daemon is unavailable.
      - run: python tests/remote_e2e.py --skip-ssh

  bundle:
    name: Desktop bundle
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    uses: ./.github/workflows/bundle.yml

  # Branch protection requires this job; skipped checks pass, while failures or cancellations block merging.
  required:
    name: Required checks
    if: always()
    needs: [changes, format, web, rust, bundle]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS" > /dev/null
