name: Desktop bundles

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  remote-linux:
    name: Remote Agent (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    # Build against an older glibc to support more Linux distributions.
    container: ubuntu:22.04
    timeout-minutes: 60
    steps:
      - run: apt-get update && apt-get install -y curl git build-essential pkg-config libssl-dev ca-certificates
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install
      - uses: ./.github/actions/setup-rust-cache
        with:
          purpose: remote-release-x86_64-unknown-linux-gnu-ubuntu22
      - run: cargo build --release -p tandem-server --locked
      - run: node scripts/prepare-remote.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: remote-x86_64-unknown-linux-gnu
          path: src-tauri/remote/x86_64-unknown-linux-gnu/
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: remote-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
          - runner: windows-2022
            platform: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-dependencies
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.59.0'
      - run: rustup toolchain install
      - uses: ./.github/actions/setup-rust-cache
        with:
          purpose: desktop-release-${{ matrix.platform }}
      - uses: actions/download-artifact@v8
        with:
          pattern: remote-*
          path: artifacts
      - name: Add remote Agents to bundle resources
        shell: bash
        run: |
          for directory in artifacts/remote-*; do
            target="${directory#artifacts/remote-}"
            mkdir -p "src-tauri/remote/$target"
            cp "$directory/tandem-server" "src-tauri/remote/$target/tandem-server"
            cp "$directory/artifact.json" "src-tauri/remote/$target/artifact.json"
            chmod 700 "src-tauri/remote/$target/tandem-server"
          done
      # This also verifies the resource layout used by a standalone local build.
      - run: just desktop-build
        shell: bash
      - name: Verify standalone remote resources
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readdirSync } from 'node:fs';
          import { REMOTE_TARGETS, verifyArtifact } from './scripts/remote-artifacts.mjs';
          assert.deepEqual(readdirSync('target/release/remote').sort(), [...REMOTE_TARGETS].sort());
          for (const target of REMOTE_TARGETS) {
            verifyArtifact({ root: process.cwd(), target, directory: 'target/release/remote' });
          }
          JS
      # Full builds reuse the Linux artifact staged by the shared remote build job.
      - run: just desktop-build-full
        shell: bash
      # macOS uses the ad hoc signature configured in tauri.conf.json without an Apple certificate.
      - run: just desktop-bundle
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: tandem-${{ matrix.platform }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
