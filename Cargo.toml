[workspace]
members = [
  "crates/copilot-runtime",
  "crates/tandem-core",
  "crates/tandem-dev-server",
  "crates/tandem-protocol",
  "crates/tandem-remote",
  "crates/tandem-server",
  "src-tauri",
]
default-members = ["crates/tandem-dev-server"]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
